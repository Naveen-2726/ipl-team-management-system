spring.application.name=IPL Team Management System

# Database Configuration (Local Development - PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/ipl_management
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration (no in-memory default user; JWT only)
# spring.security.user.name=admin
# spring.security.user.password=admin123

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Custom server port per user request
server.port=8080

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
