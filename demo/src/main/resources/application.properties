spring.application.name=IPL Team Management System

# Database Configuration - MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ipl_management}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration (no in-memory default user; JWT only)
# spring.security.user.name=admin
# spring.security.user.password=admin123

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Dynamic server port for Render deployment
server.port=${PORT:8080}
server.address=0.0.0.0

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
