spring.application.name=IPL Team Management System

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ipl_management
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration (no in-memory default user; JWT only)
# spring.security.user.name=admin
# spring.security.user.password=admin123

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Custom server port per user request
server.port=8080

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
