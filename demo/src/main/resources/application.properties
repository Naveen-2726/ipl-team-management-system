spring.application.name=IPL Team Management System

# Database Configuration (Render environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ipl_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration (no in-memory default user; JWT only)
# spring.security.user.name=admin
# spring.security.user.password=admin123

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Dynamic server port for Render deployment
server.port=${PORT:8080}

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
