spring.application.name=IPL Team Management System

# Database Configuration (Dynamic - supports both local and Render)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipl_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration (no in-memory default user; JWT only)
# spring.security.user.name=admin
# spring.security.user.password=admin123

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Dynamic server port for Render deployment
server.port=${PORT:8080}

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
