# Production Configuration for Render Deployment
spring.application.name=IPL Team Management System

# Database Configuration - Uses environment variables for production
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ipl_management}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Server port (Render will provide PORT environment variable)
server.port=${PORT:8080}

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN