# Production Configuration for Render Deployment
spring.application.name=IPL Team Management System

# Database Configuration handled by DatabaseConfig.java
# DataSource bean will handle URL conversion from Render's postgres:// to jdbc:postgresql://
# Connection pool settings are configured in the DataSource bean

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Server configuration for Render deployment
server.port=${PORT:10000}
server.address=0.0.0.0

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN