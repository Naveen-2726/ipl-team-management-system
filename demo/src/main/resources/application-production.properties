# Production Configuration for Render Deployment
spring.application.name=IPL Team Management System

# Database Configuration - Uses environment variables for production (Render PostgreSQL)
# Render provides DATABASE_URL in the format: postgres://username:password@hostname:port/database
# We need to convert it to JDBC format: jdbc:postgresql://hostname:port/database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ipl_management}
spring.datasource.driver-class-name=org.postgresql.Driver

# Additional database configuration for Render compatibility
spring.datasource.hikari.connection-init-sql=SELECT 1

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Swagger Configuration
springdoc.swagger-ui.enabled=true

# Server port (Render will provide PORT environment variable)
server.port=${PORT:8080}

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN